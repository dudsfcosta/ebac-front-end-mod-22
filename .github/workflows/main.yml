# Nome do workflow. aparece na aba Actions do GitHub
name: Pipeline CI/CD

# Definir quando o pipeline será disparado
on: 
  push:
    branches:
      - master
  pull_request: # Boa prática: rodar também em PRs para a master
    branches:
      - master
  workflow_dispatch: # habilitar o botão "Run workflow" no GitHub Actions

jobs:
  # ----------------------------------------------------
  # 1. JOB DE LINTING
  # ----------------------------------------------------
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ----------------------------------------------------
  # 2. JOB DE BUILD
  # ----------------------------------------------------
  build:
    name: Build Project
    needs: lint # Faz o build aguardar o lint. Se o lint falhar, o build é cancelado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: "npm"
          cache-dependency-path: package-lock.json
          
      - name: Instalação das dependências
        run: npm ci
        
      - name: Rodar o build
        run: npm run build
        env:
          TMDB_API_URL: ${{ vars.TMDB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_API_IMG_URL: ${{ vars.NEXT_PUBLIC_TMDB_API_IMG_URL }}

  # ----------------------------------------------------
  # 2. JOB DE DEPLOY
  # ----------------------------------------------------
  deploy:
    name: Deploy to Vercel
    needs: build # Só faz deploy se o build compilar corretamente
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
# Apenas faz deploy se for um push direto na branch master (não faz em PRs abertos)
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
  
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
