# Nome do workflow. aparece na
name: Pipeline CI/CD

# Definir quando o pipeline será disparado
on: 
  push:
    branches:
      - main

  workflow_dispatch: # habilitar o botão "Run workflow" no GitHub Actions
jobs :
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Instalação das dependências
        run: npm install
        
      - name: Rodar o build
        run: npm run build
